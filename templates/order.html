{% extends "base.html" %}


{% block title %}

Checkout

{% endblock %}



{% block content %}



<div class="container mt-5">



<div class="row">



<div class="col-md-7">



<div class="card shadow p-4">



<h2 class="mb-4">

Customer Details

</h2>




<form method="POST"
action="/order">



<div class="mb-3">


<label class="form-label">

Name

</label>


<input 
type="text"
name="name"
class="form-control"
placeholder="Enter your name"
required>


</div>




<div class="mb-3">


<label class="form-label">

Email

</label>


<input 
type="email"
name="email"
class="form-control"
placeholder="Enter your email"
required>


</div>





<div class="mb-3">


<label class="form-label">

Phone

</label>


<input 
type="text"
name="phone"
class="form-control"
placeholder="Enter phone number"
required>


</div>





<div class="mb-3">


<label class="form-label">

Address

</label>


<textarea
name="address"
class="form-control"
rows="3"
placeholder="Enter address"
required></textarea>


</div>





<button class="btn btn-success btn-lg">

Place Order

</button>




</form>




</div>


</div>





<div class="col-md-5">



<div class="card shadow p-4">


<h3>

Order Summary

</h3>



{% for item in cart %}



<p>

{{item.name}}

x

{{item.quantity}}

=
₹{{item.price * item.quantity}}

</p>



{% endfor %}




<hr>


<h4>

Total: ₹{{total}}

</h4>



</div>


</div>




</div>



</div>



{% endblock %}
