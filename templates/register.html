{% extends "base.html" %}


{% block title %}

Register

{% endblock %}



{% block content %}



<div class="container mt-5">


<div class="row justify-content-center">


<div class="col-md-5">


<div class="card shadow p-4">



<h2 class="text-center mb-4">

Create Account

</h2>




<form method="POST">



<div class="mb-3">


<label class="form-label">

Name

</label>


<input 
type="text"
class="form-control"
name="name"
placeholder="Enter name"
required>


</div>




<div class="mb-3">


<label class="form-label">

Email

</label>


<input 
type="email"
class="form-control"
name="email"
placeholder="Enter email"
required>


</div>




<div class="mb-3">


<label class="form-label">

Password

</label>


<input 
type="password"
class="form-control"
name="password"
placeholder="Enter password"
required>


</div>




<button class="btn btn-success w-100">

Register

</button>



</form>



<p class="text-center mt-3">


Already have an account?


<a href="/login">

Login

</a>


</p>



</div>


</div>


</div>


</div>



{% endblock %}
