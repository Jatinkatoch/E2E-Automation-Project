{% extends "base.html" %}


{% block title %}

Order Success

{% endblock %}



{% block content %}



<div class="container mt-5">



<div class="card shadow text-center p-5">



<h1 class="text-success">

✔ Order Placed Successfully

</h1>




<h4 class="mt-4">

Thank you, {{customer}}

</h4>




<p class="mt-3">

Your order number is:

<strong>

#{{order_number}}

</strong>

</p>




<p>

Order Date:

{{date}}

</p>




<p>

Order Total:

<strong>

₹{{total}}

</strong>

</p>




<a href="/"
class="btn btn-primary mt-4">

Continue Shopping

</a>



</div>



</div>



{% endblock %}
