{% extends "base.html" %}


{% block title %}

{{product.name}}

{% endblock %}



{% block content %}



<div class="container mt-5">



<div class="row align-items-center">



<div class="col-md-6">


<img 
src="{{product.image}}"
class="img-fluid rounded shadow">



</div>





<div class="col-md-6">



<h1>

{{product.name}}

</h1>



<span class="badge bg-primary">

{{product.category}}

</span>




<h3 class="mt-3">

₹{{product.price}}

</h3>



<p>

{{product.description}}

</p>



<h5>

⭐ {{product.rating}}

</h5>




<a href="/add/{{product.id}}"
class="btn btn-success btn-lg mt-3">

Add To Cart

</a>



<a href="/"
class="btn btn-secondary btn-lg mt-3">

Back

</a>



</div>


</div>


</div>



{% endblock %}
